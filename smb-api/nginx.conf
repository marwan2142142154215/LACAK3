server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 4m;
    resolver 127.0.0.11 valid=5s ipv6=off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    error_page 429 = @smb_rate_limited;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /api/v1/auth/login {
        limit_req zone=smb_auth burst=5 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    location = /api/v1/auth/login/verify {
        limit_req zone=smb_auth burst=5 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    location @smb_rate_limited {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Access-Control-Allow-Origin $smb_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
        add_header Vary "Origin" always;
        add_header Retry-After "60" always;
        return 429 '{"success":false,"message":"Terlalu banyak percobaan. Tunggu sebentar lalu coba lagi.","errors":{}}';
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        try_files $uri =404;
        set $api_upstream api:9000;
        fastcgi_pass $api_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(?:env|log|ini|conf|sql|bak)$ {
        deny all;
    }
}
