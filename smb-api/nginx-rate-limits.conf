map $http_cf_connecting_ip $smb_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

map $request_method $smb_auth_limit_key {
    default "";
    POST    $smb_client_ip;
}

limit_req_zone $smb_auth_limit_key zone=smb_auth:10m rate=10r/m;

map $http_origin $smb_cors_origin {
    default                           "";
    "https://app.lacaksmbbot.com"    $http_origin;
    "http://localhost:5173"          $http_origin;
    "http://127.0.0.1:5173"          $http_origin;
}
