server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 https://api.lacaksmbbot.com https://*.ingest.sentry.io https://cloudflareinsights.com; img-src 'self' data: https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data:; script-src 'self' https://static.cloudflareinsights.com 'sha256-wBfFTYLV1r8vIXuCoizaLjXLWvJS4CW+lsxpCIixqM0=' 'sha256-8pmCcaiVEj882+Bi/vNf0Pk2W/e5YH9CLREbdYcHVP8='" always;

    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 https://api.lacaksmbbot.com https://*.ingest.sentry.io https://cloudflareinsights.com; img-src 'self' data: https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data:; script-src 'self' https://static.cloudflareinsights.com 'sha256-wBfFTYLV1r8vIXuCoizaLjXLWvJS4CW+lsxpCIixqM0=' 'sha256-8pmCcaiVEj882+Bi/vNf0Pk2W/e5YH9CLREbdYcHVP8='" always;
        add_header Cache-Control "no-cache, no-store, max-age=0, must-revalidate, no-transform" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
